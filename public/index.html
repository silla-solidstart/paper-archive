<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Paper">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/styles.css">
<title>Paper Archive</title>
</head>
<body>
<header class="top">
  <div class="brand">Paper Archive</div>
  <div class="who" id="who"></div>
  <button class="small" id="space" hidden></button>
  <button class="small" id="lang" aria-label="Language">日本語</button>
</header>

<main id="view" aria-live="polite"></main>

<nav class="tabs" id="tabs">
  <a href="#/" data-tab="scan"><span class="glyph">📷</span><span>Scan</span></a>
  <a href="#/recent" data-tab="recent"><span class="glyph">🗂</span><span>Recent</span></a>
  <a href="#/actions" data-tab="actions"><span class="glyph">⚠️</span><span>Actions</span></a>
  <a href="#/search" data-tab="search"><span class="glyph">🔍</span><span>Search</span></a>
</nav>

<input id="file" type="file" accept="image/*,application/pdf" capture="environment" hidden>
<script src="/app.js"></script>
</body>
</html>
