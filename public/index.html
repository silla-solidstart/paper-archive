<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Paper">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@600&text=Paper%20Archive&family=Roboto:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<title>Paper Archive</title>
</head>
<body>
<header class="top">
  <div class="brand"><svg class="brandmark" viewBox="0 0 512 512" aria-hidden="true">
      <rect x="92" y="212" width="212" height="212" rx="26" fill="currentColor"/>
      <rect x="156" y="152" width="212" height="212" rx="26" fill="#e34234" stroke="var(--bg)" stroke-width="10"/>
      <rect x="220" y="92" width="212" height="212" rx="26" fill="var(--bg)" stroke="currentColor" stroke-width="24"/>
      <rect x="258" y="154" width="136" height="94" rx="12" fill="none" stroke="currentColor" stroke-width="18"/>
      <path d="M258 170 L326 222 L394 170" fill="none" stroke="currentColor" stroke-width="18" stroke-linejoin="round"/>
</svg><span class="wordmark">Paper Archive</span></div>
  <button class="avatar" id="menuBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Account"><span id="avatarText"></span></button>
</header>
<div class="sheet" id="menu" hidden role="menu">
  <div class="who" id="who"></div>
  <div class="label" id="archLabel">Archive</div>
  <div id="archives"></div>
  <div class="sep"></div>
  <button role="menuitem" id="shareBtn"><i data-icon="qr-code"></i><span>Share</span></button>
  <button role="menuitem" id="adminBtn" hidden><i data-icon="shield-check"></i><span>Admin</span></button>
  <button role="menuitem" id="lang"><i data-icon="languages"></i><span>日本語</span></button>
  <div class="sep"></div>
  <a role="menuitem" id="signout" href="/auth/logout" hidden><i data-icon="log-out"></i><span>Sign out</span></a>
</div>

<main id="view" aria-live="polite"></main>

<nav class="tabs" id="tabs">
  <a href="#/" data-tab="camera"><i class="glyph" data-icon="camera"></i><span>Camera</span></a>
  <a href="#/archive" data-tab="archive"><i class="glyph" data-icon="files"></i><span>Papers</span></a>
  <a href="#/actions" data-tab="todo"><i class="glyph" data-icon="list-checks"></i><span>To do</span></a>
</nav>

<input id="fileCam" type="file" accept="image/*" capture="environment" hidden>
<input id="fileUp" type="file" accept="image/*,application/pdf" hidden>
<script src="/icons.js"></script>
<script src="/app.js"></script>
</body>
</html>
