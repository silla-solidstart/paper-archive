<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Archive</title>
<style>
  :root { color-scheme: light dark; --bg:#fafaf8; --fg:#1a1a1a; --muted:#6b6b6b; --accent:#1d4ed8; --card:#fff; --line:#e5e5e0; --warn-bg:#fef3c7; --warn-fg:#78350f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#999; --accent:#60a5fa; --card:#1b1b1b; --line:#2a2a2a; --warn-bg:#3a2e0a; --warn-fg:#fde68a; } }
  * { box-sizing: border-box; }
  body { margin:0; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); background:var(--bg); color:var(--fg); font: 16px/1.5 -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 24px 0 4px; }
  h2.section { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 28px 0 8px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  .who { display:flex; justify-content:space-between; align-items:center; gap:12px; margin: 0 0 16px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
  .who a { color: var(--accent); }
  .signin { display:inline-block; padding: 10px 16px; border:1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--fg); text-decoration:none; font-weight: 600; }
  .scan { display:block; width:100%; padding: 28px 16px; font-size: 20px; font-weight: 600; color:#fff; background: var(--accent); border:0; border-radius: 16px; cursor:pointer; }
  .scan:disabled { opacity:.5; }
  input[type=file] { display:none; }
  details.token { margin: 12px 0; font-size: 13px; color: var(--muted); }
  details.token input { width:100%; margin-top:6px; padding: 10px; border:1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); font-size: 14px; }
  .status { margin: 16px 0; color: var(--muted); min-height: 1.5em; }
  .card { background: var(--card); border:1px solid var(--line); border-radius: 12px; padding: 16px; margin: 12px 0; }
  .card h3 { font-size: 17px; margin: 0 0 4px; font-weight: 600; }
  .meta { color: var(--muted); font-size: 14px; }
  .action, .notice { margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-fg); font-size: 14px; }
  .keep { margin-top: 8px; font-size: 14px; }
  .decide { margin-top: 8px; display:flex; gap:6px; flex-wrap: wrap; }
  .decide button { font-size: 13px; padding: 6px 10px; border:1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); cursor:pointer; }
  .drive { margin-top: 8px; font-size: 14px; }
  .drive a { color: var(--accent); }
  pre { white-space: pre-wrap; font-size: 12px; color: var(--muted); max-height: 200px; overflow:auto; }
  details { margin-top: 10px; }
  .empty { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Paper Archive</h1>
  <p class="sub">Scan mail → know what it wants → know whether to keep the original.</p>

  <div class="who" id="who"></div>

  <button class="scan" id="scanBtn">Scan</button>
  <input id="file" type="file" accept="image/*,application/pdf" capture="environment">

  <details class="token" id="tokenBox">
    <summary>Use an API token instead</summary>
    <input id="token" type="password" placeholder="APP_BEARER_TOKEN" autocomplete="off">
  </details>

  <div class="status" id="status"></div>
  <div id="results"></div>

  <h2 class="section">Recent</h2>
  <div id="inbox" class="empty">—</div>
</main>

<script>
/*
 * Photos are downscaled here, in the browser, before upload. The Worker cannot
 * resize images, Claude's per-image limit is ~5 MB, and a phone JPEG is 3-8 MB.
 * Drawing through a canvas also converts HEIC to JPEG on iOS, which neither
 * Document AI nor Claude accept directly.
 */
const MAX_EDGE = 2200;
const JPEG_QUALITY = 0.85;

const $ = (id) => document.getElementById(id);
const tokenEl = $("token"), status = $("status"), results = $("results"), who = $("who"), inbox = $("inbox");
let signedIn = false;

try { tokenEl.value = localStorage.getItem("pa_token") || ""; } catch {}
tokenEl.addEventListener("change", () => { try { localStorage.setItem("pa_token", tokenEl.value); } catch {} loadInbox(); });

function authHeaders(extra = {}) {
  const h = { ...extra };
  if (!signedIn && tokenEl.value) h["Authorization"] = "Bearer " + tokenEl.value;
  return h;
}

async function whoami() {
  try {
    const res = await fetch("/api/me");
    if (res.ok) {
      const { user } = await res.json();
      signedIn = true;
      who.innerHTML = `<span>Signed in as ${esc(user.name || user.email)} · filing to your Google Drive</span><a href="/auth/logout">Sign out</a>`;
      $("tokenBox").hidden = true;
      return;
    }
  } catch {}
  signedIn = false;
  who.innerHTML = `<a class="signin" href="/auth/login">Sign in with Google</a><span>Scans are filed to your own Drive</span>`;
}

async function loadInbox() {
  if (!signedIn && !tokenEl.value) { inbox.textContent = "Sign in to see recent documents."; return; }
  try {
    const res = await fetch("/api/recent", { headers: authHeaders() });
    if (!res.ok) { inbox.textContent = res.status === 503 ? "No database configured yet." : "Could not load."; return; }
    const { documents } = await res.json();
    inbox.innerHTML = "";
    inbox.className = documents.length ? "" : "empty";
    if (!documents.length) { inbox.textContent = "Nothing scanned yet."; return; }
    for (const d of documents) inbox.appendChild(card(d, { compact: true }));
  } catch { inbox.textContent = "Could not load."; }
}

(async () => { await whoami(); await loadInbox(); })();

$("scanBtn").addEventListener("click", () => $("file").click());

$("file").addEventListener("change", async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  e.target.value = "";
  await process(file);
});

async function downscale(file) {
  if (file.type === "application/pdf") return { blob: file, type: "application/pdf" };
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, MAX_EDGE / Math.max(bitmap.width, bitmap.height));
  const w = Math.round(bitmap.width * scale), h = Math.round(bitmap.height * scale);
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
  bitmap.close?.();
  const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", JPEG_QUALITY));
  return { blob, type: "image/jpeg" };
}

async function process(file) {
  const btn = $("scanBtn");
  btn.disabled = true;
  try {
    status.textContent = "Preparing…";
    const { blob, type } = await downscale(file);
    status.textContent = `Uploading ${(blob.size / 1024).toFixed(0)} KB…`;
    const res = await fetch("/api/process", {
      method: "POST",
      headers: authHeaders({ "Content-Type": type, "X-Filename": encodeURIComponent(file.name || "scan") }),
      body: blob,
    });
    const data = await res.json();
    if (!res.ok) { status.textContent = "Failed: " + (data.error || res.status) + (data.stage ? ` (${data.stage})` : ""); return; }
    status.textContent = "";
    results.prepend(card({ ...data.extraction, id: data.id, ocr: data.ocr, filed: data.filed, filing_error: data.filing_error }, { compact: false }));
    loadInbox();
  } catch (err) {
    status.textContent = "Error: " + err.message;
  } finally {
    btn.disabled = false;
  }
}

const RETENTION = {
  digital_sufficient: "◎ Digital copy likely sufficient",
  keep_temporarily:   "◍ Keep temporarily",
  keep_original:      "◑ Keep original",
  unsure:             "⚠ Unsure — your call",
};

/* One card for both the fresh result and inbox rows. `d` uses the API's column names. */
function card(d, { compact }) {
  const el = document.createElement("div");
  el.className = "card";
  const money = d.amount != null ? `${d.currency || ""} ${Number(d.amount).toLocaleString()}` : null;
  const meta = [d.issuer, d.document_date, money].filter(Boolean).join(" · ");

  let driveLine = "";
  if (d.filed) driveLine = `<div class="drive">📁 <a href="${esc(d.filed.link)}" target="_blank" rel="noopener">${esc(d.filed.path)}</a></div>`;
  else if (d.filing_error === "reconnect_google") driveLine = `<div class="notice">Google access has lapsed — <a href="/auth/login">sign in again</a>, then re-scan to file it.</div>`;
  else if (d.filing_error) driveLine = `<div class="notice">Indexed, but filing to Drive failed. Nothing is kept server-side, so re-scan to file it.</div>`;
  else if (!compact && !signedIn) driveLine = `<div class="meta">Not filed — sign in with Google to file scans to your Drive.</div>`;
  else if (compact && d.status === "failed") driveLine = `<div class="notice">Not in Drive — re-scan to file it.</div>`;

  el.innerHTML = `
    <h3>${esc(d.title)}</h3>
    <div class="meta">${esc(meta)}</div>
    ${compact ? "" : `<div class="meta">${esc(d.summary)}</div>`}
    ${d.action_required ? `<div class="action">⚠ Action required: ${esc(d.action_type || "")}${d.action_date ? " · due " + esc(d.action_date) : ""}</div>` : ""}
    <div class="keep">${RETENTION[d.retention] || esc(d.retention)}${compact ? "" : ` <span class="meta">— ${esc(d.retention_reason)}</span>`}</div>
    ${d.id ? `<div class="decide" data-id="${esc(d.id)}">
      <button data-r="digital_sufficient">Digital is enough</button>
      <button data-r="keep_temporarily">Keep for now</button>
      <button data-r="keep_original">Keep original</button>
    </div>` : ""}
    ${driveLine}
    ${d.ocr ? `<details><summary class="meta">OCR (${d.ocr.pages} page${d.ocr.pages === 1 ? "" : "s"}, ${d.ocr.chars} chars)${d.id ? " · indexed" : " · not indexed"}</summary><pre>${esc(d.ocr.text)}</pre></details>` : ""}
  `;

  el.querySelectorAll(".decide button").forEach((b) => b.addEventListener("click", async () => {
    const id = b.parentElement.dataset.id, retention = b.dataset.r;
    b.disabled = true;
    const res = await fetch(`/api/documents/${id}/retention`, {
      method: "PATCH",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ retention, reason: "Decided by user" }),
    });
    if (res.ok) { el.querySelector(".keep").textContent = RETENTION[retention]; el.querySelector(".decide").remove(); }
    else b.disabled = false;
  }));

  return el;
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }
</script>
</body>
</html>
