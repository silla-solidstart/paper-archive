<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  body{margin:0;background:#e9e7e2;color:#1e2a44;font:14px/1.4 'IBM Plex Sans JP',-apple-system,sans-serif;padding:24px}
  h1{font-size:18px;margin:0 0 14px} h2{font-size:13px;color:#666;font-weight:500;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.06em}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .p{border-radius:12px;padding:18px;display:flex;align-items:center;justify-content:center;gap:16px}
  .light{background:#f6f3ee}.dark{background:#0f1526}.white{background:#fff}
  img{display:block}
  .tab{background:#fff;border-radius:10px 10px 0 0;padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:12px;color:#333;width:220px;box-shadow:0 -1px 0 #ddd inset}
  .tabbar{background:#dedad2;border-radius:12px 12px 0 0;padding:10px 12px 0;display:flex;gap:8px;align-items:flex-end}
  .phone{background:linear-gradient(#5a6b8c,#2b3552);border-radius:28px;padding:22px 18px;width:250px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;justify-items:center}
  .app{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:10px}
  .app img{width:48px;height:48px;border-radius:11px} .app .g{width:48px;height:48px;border-radius:11px;background:rgba(255,255,255,.28)}
  .print{background:#fff;border-radius:6px;padding:26px 30px;width:250px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.12)}
  .print .t{font-weight:700;font-size:20px;margin:10px 0 2px}.print .s{font-size:11px;color:#555}
</style>
<h1>Paper Archive — the brand in context (3-card stack · IBM Plex Sans JP)</h1>
<h2>Mark — light · dark · monochrome</h2>
<div class="row"><div class="p light"><img src="mark.svg" width="120"></div><div class="p dark"><img src="mark-dark.svg" width="120"></div><div class="p white"><img src="mark-mono.svg" width="120"></div></div>
<h2>Lockups</h2>
<div class="row"><div class="p light" style="padding:8px 18px"><img src="lockup.svg" width="560"></div><div class="p dark" style="padding:8px 18px"><img src="lockup-dark.svg" width="560"></div></div>
<h2>Favicon in a browser tab (16 px) · app icon on a home screen · printed QR poster header</h2>
<div class="row">
  <div><div class="tabbar"><div class="tab"><img src="favicon.svg" width="16" height="16"> Paper Archive</div><div class="tab" style="opacity:.6;width:120px"><span style="width:16px;height:16px;background:#ccc;border-radius:3px;display:inline-block"></span> Gmail</div></div><div style="background:#fff;height:26px;border-radius:0 0 12px 12px"></div></div>
  <div class="phone"><div class="app"><div class="g"></div>Mail</div><div class="app"><div class="g"></div>Photos</div><div class="app"><img src="icon-square.svg">Paper</div><div class="app"><div class="g"></div>Maps</div></div>
  <div class="print"><img src="mark.svg" width="64" style="margin:0 auto"><div class="t">Paper Archive</div><div class="s">ペーパーアーカイブ · スキャンして開く</div></div>
</div>
