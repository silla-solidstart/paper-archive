name = "paper-archive"
main = "src/index.ts"
compatibility_date = "2026-09-18"
compatibility_flags = ["nodejs_compat"]

# Single environment — everything is production. See CLAUDE.md § Environments.
[[routes]]
pattern = "pa.solidstart.jp"
custom_domain = true

# Catch-up for readings cut off after the upload response (see index.ts scheduled()).
[triggers]
crons = ["*/2 * * * *"]

# Originals: one object per document, written before OCR (CLAUDE.md § Originals).
# Create once: npx wrangler r2 bucket create paper-archive-originals --location apac
[[r2_buckets]]
binding = "ORIGINALS"
bucket_name = "paper-archive-originals"

# Non-secret config. Secrets go in .dev.vars locally and `wrangler secret put`
# in production: GCP_SA_CLIENT_EMAIL, GCP_SA_PRIVATE_KEY, ANTHROPIC_API_KEY,
# DATABASE_URL, GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET.
[vars]
GCP_PROJECT_ID = "solidstart-paper-archive"
GCP_PROJECT_NUMBER = "318291773922"
GCP_DOCAI_LOCATION = "asia-southeast1"
GCP_DOCAI_PROCESSOR_ID = "e362ac4f7e80f6e"
GCP_DOCAI_PROCESSOR_VERSION = "pretrained-ocr-v2.1.1-2025-01-31"
GOOGLE_OAUTH_REDIRECT_URI = "https://pa.solidstart.jp/auth/callback"
# Bootstrap admins: always allowed and admin, even if allowed_users is emptied.
ADMIN_EMAILS = "silla@solidstart.jp"

# The PWA. Served for any path the Worker does not handle.
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The Worker fronts every request: the app is served only to an allowed session.
run_worker_first = true
